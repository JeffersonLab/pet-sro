---
io-services:
  reader:
    #    class: org.jlab.ersap.actor.pet.engine.SimPetStreamSourceEngine
    class: org.jlab.ersap.actor.pet.engine.SimPetMultiStreamSourceEngine
    name: Source
  writer:
    class: org.jlab.ersap.actor.pet.engine.PetStreamSinkEngine
    name: Sink
services:
  - class: org.jlab.ersap.actor.pet.engine.PetGeometryProcessorEngine
    name: GProcessor
configuration:
  io-services:
    reader:
      ringBufferSize: 1024
      dataSize: 100
      streamCount: 2
    #      streamHost: "hostname/IP"
    #      streamPort: 7777
    #      connectionTimeout: 5000
    #      readTimeout: 2000
    writer:
      # The simulator chain carries opaque byte arrays, not EVIO blocks, so the
      # sink must accept binary/data-jobj here. The default is binary/data-evio,
      # which is what the C++ EjfatReceiverActor chain uses.
      dataType: "binary/data-jobj"
  services:
    GProcessor:
mime-types:
  - binary/data-evio
  - binary/data-jobj
